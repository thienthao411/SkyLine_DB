<div class="profile-container">
  
    <!-- Phần nội dung chính -->
    <main class="content">
      <section class="notification-inbox">
        

        <div class="inbox-list" *ngIf="inbox.length">
          <article class="inbox-card" *ngFor="let item of inbox">
            <div class="inbox-meta">
              <span class="inbox-type">{{ item.type === 'account' ? 'Tài khoản' : item.type === 'payment' ? 'Thanh toán' : 'Hệ thống' }}</span>
              <span class="inbox-time">{{ item.createdAt | date:'HH:mm dd/MM/yyyy' }}</span>
            </div>
            <h3>{{ item.title }}</h3>
            <p>{{ item.message }}</p>
          </article>
        </div>
      </section>

      <h2>Cài đặt thông báo</h2>
  
      <div class="notification-settings">
        <div class="setting-item" *ngFor="let noti of notifications">
          <span>{{ noti.name }}</span>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="noti.enabled" />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </main>
  </div>
