<div class="profile-container">
    <!-- MAIN CONTENT -->
    <main class="main-content">
        <h2>Thông tin cá nhân</h2>
    
        <form *ngIf="user" (ngSubmit)="onSave()">
          <div class="form-group">
            <label><i class="fa fa-user"></i> Họ và tên</label>
            <input [(ngModel)]="user.fullName" name="fullName" [readonly]="!isEditing" />
          </div>
    
          <div class="form-group">
            <label><i class="fa fa-envelope"></i> Email</label>
            <input [(ngModel)]="user.email" name="email" [readonly]="!isEditing" />
          </div>
    
          <div class="form-group">
            <label><i class="fa fa-phone"></i> Số điện thoại</label>
            <input
              [(ngModel)]="user.phone"
              name="phone"
              [readonly]="!isEditing"
              inputmode="numeric"
              maxlength="10"
              placeholder="Nhập 10 chữ số"
            />
            <small class="field-error" *ngIf="isEditing && user.phone && !isPhoneValid">
              Số điện thoại phải đúng 10 chữ số.
            </small>
          </div>
    
          <div class="form-group half">
            <label><i class="fa fa-calendar"></i> Ngày sinh</label>
            <input [(ngModel)]="user.birthday" name="birthday" [readonly]="!isEditing" />
          </div>
    
          <div class="form-group half">
            <label><i class="fa fa-venus-mars"></i> Giới tính</label>
            <select [(ngModel)]="user.gender" name="gender" [disabled]="!isEditing">
              <option>Nam</option>
              <option>Nữ</option>
              <option>Khác</option>
            </select>
          </div>
    
          <div class="form-group">
            <label><i class="fa fa-id-card"></i> Số CCCD</label>
            <input
              [(ngModel)]="user.passport"
              name="passport"
              [readonly]="!isEditing"
              inputmode="numeric"
              maxlength="12"
              placeholder="Nhập 12 chữ số"
            />
            <small class="field-error" *ngIf="isEditing && user.passport && !isPassportValid">
              Số CCCD phải đúng 12 chữ số.
            </small>
          </div>
    
          <div class="form-group half">
            <label><i class="fa fa-clock"></i> Ngày hết hạn passport</label>
            <input [(ngModel)]="user.passportExpiry" name="passportExpiry" [readonly]="!isEditing" />
          </div>
    
          <div class="form-group half">
            <label><i class="fa fa-globe"></i> Quốc tịch</label>
            <select [(ngModel)]="user.country" name="country" [disabled]="!isEditing">
              <option *ngFor="let country of countries" [value]="country">{{ country }}</option>
            </select>
          </div>
    
          <div class="form-group">
            <label><i class="fa fa-map-marker-alt"></i> Địa chỉ</label>
            <input [(ngModel)]="user.address" name="address" [readonly]="!isEditing" />
          </div>

          <div class="form-group password-section" *ngIf="isEditing">
            <label><i class="fa fa-lock"></i> Đổi mật khẩu</label>
            <input
              type="password"
              [(ngModel)]="currentPassword"
              name="currentPassword"
              placeholder="Mật khẩu hiện tại"
            />
            <input
              type="password"
              [(ngModel)]="newPassword"
              name="newPassword"
              placeholder="Mật khẩu mới (ít nhất 6 ký tự)"
            />
            <input
              type="password"
              [(ngModel)]="confirmNewPassword"
              name="confirmNewPassword"
              placeholder="Xác nhận mật khẩu mới"
            />
            <button
              type="button"
              class="btn-change-password"
              [disabled]="isChangingPassword"
              (click)="onChangePassword()"
            >
              {{ isChangingPassword ? 'Đang đổi mật khẩu...' : 'Cập nhật mật khẩu' }}
            </button>
          </div>
    
          <div class="actions">
            <button type="button" class="btn-edit" *ngIf="!isEditing" (click)="onEdit()">Chỉnh sửa thông tin</button>
            <button type="submit" class="btn-save" *ngIf="isEditing">Lưu thay đổi</button>
          </div>
        </form>

        <div class="save-popup-overlay" *ngIf="showSavePopup" (click)="closeSavePopup()">
          <div class="save-popup" [ngClass]="savePopupType" (click)="$event.stopPropagation()">
            <div class="save-popup-header">
              <strong>{{ savePopupTitle }}</strong>
              <button type="button" class="save-popup-close" (click)="closeSavePopup()">×</button>
            </div>
            <p>{{ savePopupMessage }}</p>
          </div>
        </div>
      </main>
    </div>
