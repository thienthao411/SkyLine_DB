<!-- Header -->
<header class="header">
    <div class="container">
        <div class="header-content">
            <a class="logo" routerLink="/home" aria-label="Skyline home">
                <img src="assets/images/logongang.png" alt="Skyline" class="header-logo-img">
            </a>

            <nav class="nav nav-main">
                <a routerLink="/home" routerLinkActive="active" class="nav-link">Trang chủ</a>
                <a routerLink="/intro" routerLinkActive="active" class="nav-link">Giới thiệu</a>
                <a routerLink="/promotion" routerLinkActive="active" class="nav-link">Khuyến mãi</a>
                <a routerLink="/blogs" routerLinkActive="active" class="nav-link">Blogs</a>
            </nav>

            <div class="header-actions">
                @if (!isLoggedIn) {
                    <a routerLink="/customer-sign-in" routerLinkActive="active" class="nav-link">Đăng nhập</a>
                    <a routerLink="/customer-sign-up" routerLinkActive="active" class="nav-link">Đăng ký</a>
                } @else {
                    <div class="user-menu-wrapper">
                        <div class="user-menu" (click)="toggleDropdown(); $event.stopPropagation()">
                            <span class="user-name">{{ userName }}</span>
                            <svg class="dropdown-icon" [class.active]="showDropdown" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9l6 6 6-6"></path>
                            </svg>
                        </div>

                        <div class="dropdown-menu" [class.show]="showDropdown" *ngIf="showDropdown">
                            <a routerLink="/information" class="dropdown-item" (click)="navigateToInformation($event)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                Hồ sơ
                            </a>
                            <a class="dropdown-item" (click)="toggleNotificationDropdown($event)">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                                </svg>
                                <span>Thông báo</span>
                                <span class="dropdown-badge" *ngIf="unreadNotificationCount > 0">{{ unreadNotificationCount > 99 ? '99+' : unreadNotificationCount }}</span>
                            </a>
                            <a (click)="logout()" class="dropdown-item">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                                    <polyline points="16 17 21 12 16 7"></polyline>
                                    <line x1="21" y1="12" x2="9" y2="12"></line>
                                </svg>
                                Đăng xuất
                            </a>
                        </div>

                        <div class="notification-dropdown" *ngIf="showNotificationDropdown">
                            <div class="notification-dropdown-header">
                                <strong>Thông báo</strong>
                                <button
                                    type="button"
                                    class="mark-read-all"
                                    (click)="markAllNotificationsAsRead($event)"
                                    *ngIf="unreadNotificationCount > 0">
                                    Đánh dấu đã đọc
                                </button>
                            </div>

                            <div class="notification-dropdown-body" *ngIf="!isLoadingNotifications; else loadingTpl">
                                <button
                                    type="button"
                                    class="notification-item"
                                    [class.unread]="!item.isRead"
                                    *ngFor="let item of notifications"
                                    (click)="openNotification(item, $event)">
                                    <p class="item-title">{{ item.title }}</p>
                                    <p class="item-message">{{ item.message }}</p>
                                    <div class="item-meta">
                                        <span>{{ relativeTime(item.createdAt) }}</span>
                                        <span class="unread-pill" *ngIf="!item.isRead">Chưa đọc</span>
                                    </div>
                                </button>

                                <p class="notification-empty" *ngIf="notifications.length === 0">Không có thông báo mới.</p>
                            </div>

                            <ng-template #loadingTpl>
                                <div class="notification-empty">Đang tải thông báo...</div>
                            </ng-template>
                        </div>
                    </div>
                }
            </div>
        </div>
    </div>
</header>
