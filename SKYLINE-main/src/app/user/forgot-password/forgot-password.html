<div class="container forgot-container">
  <div class="left-section">
    <a routerLink="/home" class="logo-link">
      <img src="assets/media/mainLogo.png" alt="Logo Skyline" class="auth-logo" />
    </a>
  </div>

  <div class="right-section">
    <div class="form-container forgot-card">
      <a class="back-link" routerLink="/customer-sign-in">&larr; Quay lại đăng nhập</a>

      <h1>QUÊN MẬT KHẨU</h1>
      <p class="subtitle">Thực hiện 3 bước để đặt lại mật khẩu tài khoản.</p>

      <ol class="steps">
        <li [class.active]="step === 'email'">Nhập email</li>
        <li [class.active]="step === 'otp'">Xác nhận OTP</li>
        <li [class.active]="step === 'reset' || step === 'done'">Đặt mật khẩu mới</li>
      </ol>

      <form *ngIf="step === 'email'" (ngSubmit)="submitEmail()" class="form-block">
        <div class="form-group">
          <label for="email">Email đã đăng ký</label>
          <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="Nhập email của bạn" required />
        </div>

        <button class="btn-primary" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Đang gửi...' : 'Gửi mã OTP' }}
        </button>
      </form>

      <form *ngIf="step === 'otp'" (ngSubmit)="submitOtp()" class="form-block">
        <div class="form-group">
          <label for="otp">Nhập mã OTP (6 số)</label>
          <input id="otp" name="otp" type="text" maxlength="6" [(ngModel)]="otp" placeholder="123456" required />
        </div>

        <p class="hint">Mã có hiệu lực trong {{ expiresInMinutes }} phút.</p>

        <div class="actions-row">
          <button class="btn-primary" type="submit" [disabled]="isSubmitting">
            {{ isSubmitting ? 'Đang xác nhận...' : 'Xác nhận OTP' }}
          </button>
          <button class="btn-ghost" type="button" (click)="resendOtp()" [disabled]="isSubmitting">Gửi lại mã</button>
        </div>
      </form>

      <form *ngIf="step === 'reset'" (ngSubmit)="submitResetPassword()" class="form-block">
        <div class="form-group">
          <label for="newPassword">Mật khẩu mới</label>
          <input id="newPassword" name="newPassword" type="password" [(ngModel)]="newPassword" placeholder="Nhập mật khẩu mới" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Xác nhận mật khẩu mới</label>
          <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" placeholder="Nhập lại mật khẩu mới" required />
        </div>

        <button class="btn-primary" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Đang cập nhật...' : 'Đặt lại mật khẩu' }}
        </button>
      </form>

      <div *ngIf="step === 'done'" class="done-block">
        <h3>Đổi mật khẩu thành công</h3>
        <p>Hệ thống đang chuyển bạn về trang đăng nhập...</p>
      </div>

      <p *ngIf="message" class="message" [class.success]="messageType === 'success'" [class.error]="messageType === 'error'">
        {{ message }}
      </p>
    </div>
  </div>
</div>
