<div class="forgot-shell">
  <div class="forgot-card">
    <a class="back-link" routerLink="/customer-sign-in">Quay lai dang nhap</a>

    <h1>Quen mat khau</h1>
    <p class="subtitle">Thuc hien theo 3 buoc de dat lai mat khau tai khoan.</p>

    <ol class="steps">
      <li [class.active]="step === 'email'">Nhap email</li>
      <li [class.active]="step === 'otp'">Xac nhan OTP</li>
      <li [class.active]="step === 'reset' || step === 'done'">Dat mat khau moi</li>
    </ol>

    <form *ngIf="step === 'email'" (ngSubmit)="submitEmail()" class="form-block">
      <label for="email">Email da dang ky</label>
      <input id="email" name="email" type="email" [(ngModel)]="email" placeholder="example@gmail.com" required />
      <button class="btn-primary" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Dang gui...' : 'Gui ma OTP' }}
      </button>
    </form>

    <form *ngIf="step === 'otp'" (ngSubmit)="submitOtp()" class="form-block">
      <label for="otp">Nhap ma OTP (6 so)</label>
      <input id="otp" name="otp" type="text" maxlength="6" [(ngModel)]="otp" placeholder="123456" required />
      <p class="hint">Ma co hieu luc trong {{ expiresInMinutes }} phut.</p>
      <div class="actions-row">
        <button class="btn-primary" type="submit" [disabled]="isSubmitting">
          {{ isSubmitting ? 'Dang xac nhan...' : 'Xac nhan OTP' }}
        </button>
        <button class="btn-ghost" type="button" (click)="resendOtp()" [disabled]="isSubmitting">Gui lai ma</button>
      </div>
    </form>

    <form *ngIf="step === 'reset'" (ngSubmit)="submitResetPassword()" class="form-block">
      <label for="newPassword">Mat khau moi</label>
      <input id="newPassword" name="newPassword" type="password" [(ngModel)]="newPassword" required />

      <label for="confirmPassword">Xac nhan mat khau moi</label>
      <input id="confirmPassword" name="confirmPassword" type="password" [(ngModel)]="confirmPassword" required />

      <button class="btn-primary" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Dang cap nhat...' : 'Dat lai mat khau' }}
      </button>
    </form>

    <div *ngIf="step === 'done'" class="done-block">
      <h3>Doi mat khau thanh cong</h3>
      <p>He thong dang chuyen ban ve trang dang nhap...</p>
    </div>

    <p *ngIf="message" class="message" [class.success]="messageType === 'success'" [class.error]="messageType === 'error'">
      {{ message }}
    </p>
  </div>
</div>
